services:
  codepulse-api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      WORKSPACE_ROOT: /opt/codepulse/workspaces
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/codepulse/workspaces:/opt/codepulse/workspaces
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
